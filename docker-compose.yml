services:
  appCartillas:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001

      # Base de datos cartillas
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-1433}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-dbCartillas}

      # Datamart (servidor externo)
      DB_DATAMART_HOST: ${DB_DATAMART_HOST}
      DB_DATAMART_PORT: ${DB_DATAMART_PORT:-1433}
      DB_DATAMART_DOMAIN: ${DB_DATAMART_DOMAIN:-}
      DB_DATAMART_USER: ${DB_DATAMART_USER}
      DB_DATAMART_PASSWORD: ${DB_DATAMART_PASSWORD}
      DB_DATAMART_NAME: ${DB_DATAMART_NAME}

      # Auth
      JWT_SECRET: ${JWT_SECRET}
